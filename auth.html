<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Sign in or create your AI CORE account.">
<title>AI CORE — Sign In</title>
<link rel="stylesheet" href="assets/auth.css">
</head>
<body>
<div class="auth-shell">
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="auth-nav">
    <a class="brand" href="index.html"><span class="brand-core"></span><b>AI CORE</b></a>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <div class="core-mini" aria-hidden="true"><span></span></div>
      <p class="eyebrow" data-copy="eyebrow">Your AI Control Center</p>
      <h1 id="authTitle">Войти в AI CORE</h1>
      <p class="sub" id="authSubtitle">Продолжите работу со своими AI-инструментами.</p>

      <div class="tabs" role="tablist">
        <button type="button" data-mode="signin" id="tabSignIn">Войти</button>
        <button type="button" data-mode="signup" id="tabSignUp">Регистрация</button>
      </div>

      <div class="notice" id="configNotice" hidden></div>
      <div class="notice success" id="successNotice" hidden></div>
      <div class="notice error" id="errorNotice" hidden></div>

      <form id="authForm" novalidate>
        <label><span data-copy="email">Email</span><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></label>
        <label><span data-copy="password">Пароль</span><input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="••••••••"></label>
        <label id="passwordAgainRow" hidden><span data-copy="passwordAgain">Повторите пароль</span><input id="passwordAgain" type="password" autocomplete="new-password" minlength="8" placeholder="••••••••"></label>
        <button class="submit" id="submitBtn" type="submit">Войти</button>
      </form>

      <p class="foot"><a href="index.html" data-copy="back">← Вернуться на главную</a></p>
    </section>
  </main>
</div>
<script src="assets/supabase-config.js"></script>
<script type="module" src="assets/auth.js"></script>
</body>
</html>
