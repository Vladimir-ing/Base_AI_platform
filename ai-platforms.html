<!doctype html>
<html translate="no" lang="ru">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI CORE — личная база AI-платформ</title>
<link rel="stylesheet" href="assets/app.css?v=20260817-0945">
<link rel="stylesheet" href="assets/auth.css?v=20260817-0945">
</head>
<body class="auth-pending">
<div class="auth-gate" id="authGate" role="status" aria-live="polite">
  <div class="auth-gate-mark">◆</div>
  <p>Проверяю доступ…</p>
</div>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">◆</div>
      <div>
        <h1>AI CORE</h1>
        <p id="brandSub">личная база AI-платформ</p>
      </div>
    </div>
    <div class="search"><span>⌕</span><input id="q" name="ai-core-catalog-search" type="search" placeholder="Поиск: название, задача, приём…" autocomplete="off" data-lpignore="true" data-1p-ignore="true" aria-label="Поиск по каталогу"></div>
    <button class="btn guide-btn" id="guideBtn" type="button" title="Инструкция по работе с базой">? Инструкция</button>
    <a class="btn admin-link" id="adminBtn" href="admin.html" hidden>Админ</a>
    <button class="lockchip" id="lockChip" type="button"></button>
    <button class="btn" id="assistantBtn" type="button">✦ Помощник</button>
    <button class="btn" id="compareBtn" type="button">⇄ Сравнить</button>
    <button class="btn primary" id="addBtn" type="button">+ Платформа</button>
    <div class="cloud-sync pending" id="cloudSync" role="status" aria-live="polite" title="Подключение к облачному хранилищу">
      <span class="cloud-dot" aria-hidden="true"></span>
      <span id="cloudStatus">Облако…</span>
    </div>
    <div class="access-chip pending" id="accessChip" role="status" aria-live="polite">Тариф…</div>
    <div class="auth-session" title="Текущая учётная запись">
      <span id="authUser"></span>
      <button class="btn ghost" id="logoutBtn" type="button">Выйти</button>
    </div>
    <details class="menu" id="menu">
      <summary class="btn ghost" title="Меню">⋯</summary>
      <div class="menu-pop">
        <button type="button" data-act="export">Экспорт бэкапа (с секретами)</button>
        <button type="button" data-act="exportOpen">Экспорт без доступов</button>
        <button type="button" data-act="import">Импорт из файла…</button>
        <hr>
        <button type="button" data-act="payments">Оплата: сервисы и карты…</button>
        <button type="button" data-act="master">Мастер-пароль…</button>
        <button type="button" data-act="seed">Досыпать каталог платформ</button>
        <button type="button" data-act="theme">Сменить тему</button>
        <hr>
        <button type="button" data-act="help">Инструкция по сайту</button>
        <div class="hint" id="storeHint"></div>
      </div>
    </details>
  </div>

  <div id="banners"></div>
  <div class="stats" id="stats"></div>
  <section class="attention" id="attention" hidden></section>
  <section class="economics" id="economics" hidden></section>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Ничего не найдено. Сбросьте поиск или фильтры.</div>
  <footer class="product-credit">AI CORE — продукт <a href="altera.html" target="_blank" rel="noopener noreferrer">ALTERA ↗</a></footer>
</div>

<!-- карточка платформы -->
<div class="ov" id="cardOv" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <div class="ico" id="cIco">◆</div>
      <div>
        <h2 id="cName">—</h2>
        <div class="sub" id="cSub">—</div>
      </div>
      <button class="x" type="button" data-close>✕</button>
    </div>
    <div class="sheet-body" id="cBody"></div>
    <div class="sheet-foot" id="cFoot"></div>
  </div>
</div>

<!-- универсальный диалог -->
<div class="ov" id="dlgOv" hidden>
  <div class="sheet narrow">
    <div class="sheet-head">
      <div>
        <h2 id="dTitle">—</h2>
        <div class="sub" id="dSub" hidden></div>
      </div>
      <button class="x" type="button" data-close>✕</button>
    </div>
    <div class="sheet-body" id="dBody"></div>
    <div class="sheet-foot" id="dFoot"></div>
  </div>
</div>

<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"
  integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC"
  crossorigin="anonymous"></script>
<script src="assets/supabase-client.js?v=20260817-0945"></script>
<script src="assets/i18n.js?v=20260827-0200"></script>
<script src="assets/security-utils.js?v=20260818-1200"></script>
<script src="assets/route-guard.js?v=20260827-0200"></script>
</body>
</html>
