<!doctype html>
<html translate="no" lang="ru">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — AI CORE</title>
<link rel="icon" type="image/svg+xml" href="assets/AI-CORE-favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/AI-CORE-favicon-32.png">
<link rel="apple-touch-icon" href="assets/AI-CORE-apple-touch.png">
<meta name="theme-color" content="#050706">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

</head>
<body class="auth-page">
<main class="auth-shell">
  <div class="auth-toolbar" aria-label="Language">
    <button type="button" data-language="ru" aria-pressed="true">RU</button>
    <button type="button" data-language="en" aria-pressed="false">EN</button>
  </div>

  <section class="auth-card" aria-labelledby="authTitle">
    <div class="auth-brand">
      <img class="auth-brand-mark" src="assets/AI-CORE-apple-touch.png" alt="AI CORE">
      <div>
        <h1 id="authTitle">AI CORE</h1>
        <p data-ru="Войдите, чтобы открыть личную базу AI-платформ" data-en="Sign in to open your personal AI platform database">Войдите, чтобы открыть личную базу AI-платформ</p>
      </div>
    </div>

    <div class="auth-tabs" id="authTabs" role="tablist" aria-label="Способ доступа">
      <button class="auth-tab active" type="button" role="tab" aria-selected="true" data-auth-view="login" data-ru="Вход" data-en="Sign In">Вход</button>
      <button class="auth-tab" type="button" role="tab" aria-selected="false" data-auth-view="signup" data-ru="Регистрация" data-en="Sign Up">Регистрация</button>
    </div>

    <form class="auth-form" id="loginForm" data-auth-panel="login">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" name="email" type="email" autocomplete="email" required>
      <label for="loginPassword" data-ru="Пароль" data-en="Password">Пароль</label>
      <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
      <button class="btn primary auth-submit" type="submit" data-ru="Войти" data-en="Sign In">Войти</button>
      <button class="auth-link" id="forgotBtn" type="button" data-ru="Забыли пароль?" data-en="Forgot password?">Забыли пароль?</button>
    </form>

    <form class="auth-form" id="signupForm" data-auth-panel="signup" hidden>
      <label for="signupEmail">Email</label>
      <input id="signupEmail" name="email" type="email" autocomplete="email" required>
      <label for="signupPassword" data-ru="Пароль" data-en="Password">Пароль</label>
      <input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <small data-ru="Минимум 8 символов." data-en="At least 8 characters.">Минимум 8 символов.</small>
      <button class="btn primary auth-submit" type="submit" data-ru="Создать аккаунт" data-en="Create Account">Создать аккаунт</button>
    </form>

    <form class="auth-form" id="recoveryForm" data-auth-panel="recovery" hidden>
      <h2 data-ru="Восстановление пароля" data-en="Password recovery">Восстановление пароля</h2>
      <p data-ru="Укажите email — Supabase отправит ссылку для смены пароля." data-en="Enter your email and Supabase will send a password reset link.">Укажите email — Supabase отправит ссылку для смены пароля.</p>
      <label for="recoveryEmail">Email</label>
      <input id="recoveryEmail" name="email" type="email" autocomplete="email" required>
      <button class="btn primary auth-submit" type="submit" data-ru="Отправить ссылку" data-en="Send Reset Link">Отправить ссылку</button>
      <button class="auth-link" type="button" data-auth-view="login" data-ru="Вернуться ко входу" data-en="Back to sign in">Вернуться ко входу</button>
    </form>

    <form class="auth-form" id="newPasswordForm" data-auth-panel="new-password" hidden>
      <h2 data-ru="Новый пароль" data-en="New password">Новый пароль</h2>
      <label for="newPassword" data-ru="Пароль" data-en="Password">Пароль</label>
      <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn primary auth-submit" type="submit" data-ru="Сохранить пароль" data-en="Save Password">Сохранить пароль</button>
    </form>

    <div class="auth-message" id="authMessage" role="status" aria-live="polite" hidden></div>
  </section>
  <p class="auth-credit"><span data-ru="Разработка сайта —" data-en="Built by">Разработка сайта —</span> <a class="altera-credit" href="file:///C:/Users/PC/Documents/Z.Ai/ALTERA/ALTERA_Lending/index.html" target="_blank" rel="noopener noreferrer"><img src="assets/ALTERA-logo-horizontal-web.png" alt="ALTERA"><span class="ext" aria-hidden="true">↗</span></a></p>
</main>

<script src="assets/auth-page.js?v=20260817-1800"></script>
</body>
</html>
