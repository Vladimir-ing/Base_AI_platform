name: Refactor inline assets

on:
  push:
    branches:
      - agent/refactor-app-structure

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message != 'Extract inline assets'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-app-structure

      - name: Extract inline CSS and JavaScript
        run: python tools/extract_assets.py

      - name: Validate generated structure
        run: |
          test -s assets/app.css
          test -s assets/app.js
          grep -q 'href="assets/app.css"' ai-platforms.html
          grep -q 'src="assets/app.js"' ai-platforms.html
          ! grep -q '<style>' ai-platforms.html
          ! grep -q '<script>' ai-platforms.html

      - name: Commit generated refactor
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-platforms.html assets/app.css assets/app.js
          git commit -m "Extract inline assets"
          git push origin HEAD:agent/refactor-app-structure
