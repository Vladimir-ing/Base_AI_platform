name: AI CORE Supabase auth

on:
  push:
    branches: [agent/ai-core-auth]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply auth integration
        run: python tools/upgrade_ai_core_auth.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/landing.js
          node --check assets/auth.js
          node --check assets/dashboard-auth.js
          node --check assets/app.js
      - name: Structural checks
        run: |
          grep -q 'auth.html?mode=signin' index.html
          grep -q 'auth.html?mode=signup' index.html
          grep -q 'assets/supabase-config.js' ai-platforms.html
          grep -q 'assets/dashboard-auth.js' ai-platforms.html
          grep -q 'signInWithPassword' assets/auth.js
          grep -q 'signUp' assets/auth.js
          grep -q 'signOut' assets/dashboard-auth.js
          grep -q 'sb_publishable_' assets/supabase-config.js
          ! grep -R -E 'PASTE_SB_PUBLISHABLE_KEY_HERE|service_role|sb_secret_' assets auth.html index.html ai-platforms.html
      - name: Commit generated changes
        run: |
          if ! git diff --quiet; then
            git config user.name "Vladimir"
            git config user.email "siniad8790@gmail.com"
            git add index.html ai-platforms.html assets/app.css
            git commit -m "Wire landing to Supabase authentication"
            git push
          fi
